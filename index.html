<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kingdoms &amp; Words</title>
<meta name="description" content="Kingdoms & Words — a word-puzzle kingdom builder for Pi Browser.">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161c37;
    --bg-panel:#232a52;
    --bg-panel-2:#2c3563;
    --bg-panel-3:#333d72;
    --gold:#d4a24c;
    --gold-bright:#f0c878;
    --parchment:#ece0c6;
    --parchment-dark:#d7c49a;
    --ink:#2c2113;
    --text:#f1ecdd;
    --text-dim:#a9b0d4;
    --green:#4f8b7b;
    --green-bright:#6bad9b;
    --brick:#c1583f;
    --border:#3c4576;
    --border-soft:#2e3660;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #2a3568 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #24305e 0%, transparent 50%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  h1,h2,h3, .display{
    font-family:'Cinzel', serif;
    letter-spacing:.02em;
  }
  button{font-family:inherit; cursor:pointer;}
  .app{max-width:520px; margin:0 auto; padding:14px 14px 0;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:12px;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .crest{font-size:20px;}
  .brand h1{font-size:15px; margin:0; color:var(--gold-bright); font-weight:700;}
  .pi-user{font-size:10px; color:var(--text-dim); margin-top:1px;}
  .pi-user.linked{color:var(--green-bright); font-weight:700;}
  .stats{display:flex; gap:10px; align-items:center;}
  .stat{display:flex; align-items:center; gap:5px; font-weight:700; font-size:13.5px;}
  .stat .icon{font-size:15px;}
  .stat.gold{color:var(--gold-bright);}
  .stat.gems{color:#8fc9e0;}
  .crown-badge{font-size:10px; color:#f0c878; margin-left:3px; font-weight:800;}
  .stat.day{color:var(--text-dim); font-weight:600;}
  .energy-pips{display:flex; gap:3px;}
  .pip{width:9px; height:9px; border-radius:50%; background:var(--border-soft); border:1px solid var(--border);}
  .pip.full{background:var(--green-bright); border-color:var(--green-bright); box-shadow:0 0 5px rgba(107,173,155,.7);}

  .tabnav{
    display:flex; gap:6px; margin-bottom:14px;
  }
  .tabnav button{
    flex:1; position:relative;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:9px 4px 8px;
    border-radius:10px 10px 6px 6px;
    font-family:'Cinzel',serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.03em;
    transition:all .15s ease;
  }
  .tabnav button .tico{display:block; font-size:16px; margin-bottom:2px; font-family:'Manrope';}
  .tabnav button.active{
    background:linear-gradient(180deg, var(--bg-panel-3), var(--bg-panel-2));
    color:var(--gold-bright);
    border-color:var(--gold);
    box-shadow:0 2px 0 var(--gold), inset 0 0 12px rgba(212,162,76,.12);
    transform:translateY(-1px);
  }

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }
  .panel-title{
    display:flex; align-items:center; gap:8px;
    font-size:15px; color:var(--gold-bright); margin:0 0 3px;
  }
  .panel-sub{color:var(--text-dim); font-size:12.5px; margin:0 0 12px; line-height:1.5;}

  .expansion-panel{
    border:1px dashed var(--border); border-radius:var(--radius);
    padding:12px; margin-bottom:14px; background:transparent;
  }
  .expansion-summary{
    cursor:pointer; list-style:none; margin:0; user-select:none;
  }
  .expansion-summary::-webkit-details-marker{display:none;}
  .expansion-summary::before{content:'▸ '; color:var(--text-dim);}
  .expansion-panel[open] .expansion-summary::before{content:'▾ ';}
  .exp-hint{font-size:10.5px; color:var(--text-dim); font-weight:600; margin-left:2px;}
  .expansion-panel[open] .expansion-summary{margin-bottom:12px;}

  .city-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:11px; padding-top:2px;
  }
  .plot{
    aspect-ratio:1/1;
    background:
      linear-gradient(160deg, rgba(255,255,255,.03), transparent 40%),
      var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    transform: perspective(320px) rotateX(9deg);
    transform-style: preserve-3d;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.12),
      inset 0 -9px 12px -8px rgba(0,0,0,.5),
      0 5px 0 -1px rgba(0,0,0,.32),
      0 8px 12px -4px rgba(0,0,0,.4);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .plot:active{
    transform: perspective(320px) rotateX(9deg) translateY(4px);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.1),
      inset 0 -5px 8px -6px rgba(0,0,0,.45),
      0 1px 0 -1px rgba(0,0,0,.28),
      0 2px 5px -2px rgba(0,0,0,.32);
  }
  .plot.empty, .plot.locked{
    color:var(--text-dim);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.05),
      inset 0 -4px 7px -6px rgba(0,0,0,.35);
  }
  .plot.empty:active, .plot.locked:active{
    transform: perspective(320px) rotateX(9deg) scale(.96);
  }
  .plot.empty{border-style:dashed; font-size:22px;}
  .plot.locked{border-style:dashed; opacity:.5; font-size:16px;}
  .plot.locked .lockday{font-size:8.5px; margin-top:3px; text-align:center; padding:0 2px;}
  .plot .bicon{font-size:24px; line-height:1;}
  .plot .blevel{
    position:absolute; bottom:4px; right:5px;
    font-size:9.5px; font-weight:800; color:var(--ink);
    background:var(--gold-bright);
    border-radius:6px; padding:1px 5px;
  }
  .plot .bname{font-size:8.5px; color:var(--text-dim); margin-top:3px; text-align:center; padding:0 2px;}
  .plot.legendary{
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.12),
      inset 0 -9px 12px -8px rgba(0,0,0,.5),
      0 5px 0 -1px rgba(0,0,0,.32),
      0 8px 12px -4px rgba(0,0,0,.4),
      0 0 0 1px #f0c87888, 0 0 14px #f0c87855;
  }
  .plot.legendary::after{
    content:'👑'; position:absolute; top:3px; left:4px; font-size:10px;
  }

  .legend{
    display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; font-size:11px; color:var(--text-dim);
  }
  .legend span{display:flex; align-items:center; gap:4px;}
  .swatch{width:9px; height:9px; border-radius:3px;}

  .region-tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .region-tab{
    border:1px solid var(--border); background:var(--bg-panel-2); color:var(--text-dim);
    border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .region-tab.active{border-color:var(--gold-bright); color:var(--gold-bright); background:#f0c87826;}
  .region-tab.locked{color:var(--text-dim); font-weight:600;}
  .region-tab:disabled{opacity:.5; cursor:not-allowed;}

  .memorial-grid{display:flex; gap:10px; flex-wrap:wrap;}
  .memorial{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:74px; padding:10px 6px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg-panel-2); opacity:.55;
  }
  .memorial.unlocked{opacity:1; border-color:var(--gold-bright);}
  .memorial .micon{font-size:22px;}
  .memorial .mname{font-size:9.5px; text-align:center; color:var(--text-dim); line-height:1.2;}
  .memorial.unlocked .mname{color:var(--gold-bright); font-weight:700;}

  .btn{
    border:none; border-radius:10px; padding:11px 16px;
    font-weight:700; font-size:13.5px;
    background:var(--bg-panel-3); color:var(--text);
    border:1px solid var(--border);
  }
  .btn.primary{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink); border:none;
    box-shadow:0 2px 0 #9a742f;
  }
  .btn.primary:active{transform:translateY(1px); box-shadow:none;}
  .btn.ghost{background:transparent; color:var(--text-dim);}
  .btn.green{background:linear-gradient(180deg, var(--green-bright), var(--green)); color:#0e2620; border:none;}
  .btn:disabled{opacity:.4; filter:grayscale(.4);}
  .btn.block{width:100%; display:block; text-align:center;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-sm{font-size:11px; padding:6px 10px;}

  .cat-list{display:flex; flex-direction:column; gap:8px;}
  .cat-card{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:12px; padding:11px 12px;
    text-align:left; color:var(--text);
  }
  .cat-card:active{transform:scale(.98);}
  .cat-card .cicon{font-size:22px; width:32px; text-align:center;}
  .cat-card .cinfo{flex:1;}
  .cat-card .cname{font-weight:700; font-size:13.5px;}
  .cat-card .csub{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .cat-card .ccost{font-size:12px; font-weight:800; color:var(--gold-bright); white-space:nowrap;}
  .cat-card.request .ccost::before{content:"⭐ ";}
  .cat-card:disabled, .cat-card[disabled]{opacity:.45;}

  .word-row{
    background:var(--bg-panel-2);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:9px;
    opacity:.55;
    transition:opacity .2s ease, border-color .2s ease;
  }
  .word-row.active{opacity:1; border-color:var(--gold); box-shadow:0 0 0 1px rgba(212,162,76,.25) inset;}
  .word-row.done{opacity:.7; border-color:var(--green-bright);}
  .word-clue{font-size:12px; color:var(--text-dim); margin-bottom:7px; display:flex; justify-content:space-between; gap:6px;}
  .word-clue .req-tag{color:var(--gold-bright); font-weight:800; font-size:10.5px; white-space:nowrap;}
  .word-clue .review-tag{color:#7fb8e0; font-weight:800; font-size:10.5px; white-space:nowrap;}
  .blanks{display:flex; gap:5px; flex-wrap:wrap;}
  .blank{
    width:30px; height:36px;
    border-radius:7px;
    background:var(--parchment);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel', serif; font-weight:700; font-size:16px;
    border-bottom:3px solid var(--parchment-dark);
  }
  .word-row:not(.active) .blank{background:var(--border-soft); border-bottom-color:var(--border); color:transparent;}
  .word-row.active .blank.filled{cursor:pointer;}
  .word-row.active .blank:not(.filled){background:rgba(236,224,198,.15); color:transparent; border-bottom-color:var(--border);}
  .word-row.shake .blanks{animation:shake .35s ease;}
  .word-row.safe .blanks .blank.filled{background:#6bad9b55; border-bottom-color:var(--green-bright);}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  .tile-bank{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; justify-content:center;}
  .tile{
    width:38px; height:44px;
    border-radius:8px;
    background:linear-gradient(180deg, #3a4478, #2c3563);
    border:1px solid var(--border);
    border-bottom:3px solid #1c2245;
    color:var(--gold-bright);
    font-family:'Cinzel', serif; font-weight:700; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  .tile:active{transform:translateY(2px); border-bottom-width:1px;}
  .tile.used{visibility:hidden;}
  .tile.decoy{color:var(--text-dim); opacity:.5;}

  .puzzle-actions{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; justify-content:center;}
  .puzzle-actions .btn{font-size:11.5px; padding:7px 10px;}
  .puzzle-progress{font-size:11px; color:var(--text-dim); text-align:center; margin-top:10px;}
  .puzzle-tools{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px;}
  .puzzle-tools .btn{font-size:10px; padding:5px 8px;}

  .tribe-card{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:12px; padding:12px; margin-bottom:10px;
  }
  .tribe-head{display:flex; align-items:center; gap:10px;}
  .tribe-icon{
    width:40px; height:40px; border-radius:50%;
    background:var(--bg-panel-3); display:flex; align-items:center; justify-content:center;
    font-size:19px; border:1px solid var(--border);
  }
  .tribe-name{font-weight:800; font-size:13.5px;}
  .tribe-role{font-size:11px; color:var(--text-dim);}
  .tribe-trust-label{margin-left:auto; text-align:right; font-size:10.5px; color:var(--gold-bright); font-weight:700;}
  .trust-bar{height:6px; border-radius:4px; background:var(--border-soft); margin-top:9px; overflow:hidden;}
  .trust-fill{height:100%; background:linear-gradient(90deg, var(--green), var(--green-bright));}
  .tribe-request{
    margin-top:10px; background:var(--parchment); color:var(--ink);
    border-radius:9px; padding:8px 10px; font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .tribe-request.done{background:#dcead0;}
  .tribe-request.reserved{background:#f0c87855; border:1px solid var(--gold-bright);}
  .tribe-story{margin-top:8px; font-size:11.5px; color:var(--text-dim); font-style:italic; line-height:1.5; border-top:1px dashed var(--border); padding-top:8px;}

  .shop-grid{display:flex; flex-direction:column; gap:10px;}
  .shop-item{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:12px; padding:11px 12px;
  }
  .shop-icon{font-size:22px; width:34px; text-align:center;}
  .shop-info{flex:1;}
  .shop-name{font-weight:800; font-size:13px;}
  .shop-desc{font-size:11px; color:var(--text-dim); margin-top:1px; line-height:1.4;}
  .shop-buy{font-size:12px; padding:8px 12px; white-space:nowrap;}
  .fair-note{
    margin-top:4px; background:rgba(79,139,123,.15); border:1px solid var(--green);
    border-radius:10px; padding:10px 12px; font-size:11.5px; color:#bfe4d8; line-height:1.5;
  }
  .owned-tag{font-size:10px; color:var(--green-bright); font-weight:800;}

  .skin-row{display:flex; gap:6px; margin-top:6px;}
  .skin-dot{width:20px; height:20px; border-radius:50%; border:2px solid transparent;}
  .skin-dot.active{border-color:var(--gold-bright);}
  .legendary-dot{background:#2a2a35; font-size:11px; display:flex; align-items:center; justify-content:center;}
  .sell-row{display:flex; gap:6px; margin-top:8px; align-items:center;}
  .sell-select{
    flex:1; min-width:0; background:var(--bg-panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:5px 6px; font-size:11px;
  }
  .gem-buy{color:#8fc9e0;}
  .dual-buy{display:flex; flex-direction:column; gap:6px; align-items:stretch;}

  .overlay{
    position:fixed; inset:0; background:rgba(10,13,28,.72);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:18px 18px 0 0; padding:18px 16px 22px;
    width:100%; max-width:520px; max-height:82vh; overflow-y:auto;
  }
  .modal-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
  .modal h2{margin:0 0 4px; font-size:16px; color:var(--gold-bright);}
  .modal .sub{color:var(--text-dim); font-size:12px; margin-bottom:14px;}
  .opt-list{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; text-align:left; color:var(--text);
  }
  .opt .oicon{font-size:20px; width:28px; text-align:center;}
  .opt .oinfo{flex:1;}
  .opt .oname{font-weight:700; font-size:13px;}
  .opt .osub{font-size:10.5px; color:var(--text-dim); margin-top:1px;}
  .opt .ocost{font-weight:800; font-size:12px; color:var(--gold-bright);}
  .opt:disabled{opacity:.4;}

  .toast-wrap{position:fixed; top:12px; left:0; right:0; display:flex; justify-content:center; z-index:80; pointer-events:none;}
  .toast{
    background:var(--gold-bright); color:var(--ink); font-weight:800; font-size:12.5px;
    padding:9px 16px; border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.35);
    opacity:0; transform:translateY(-14px); transition:all .25s ease;
    max-width:90%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .req-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--gold-bright); color:var(--ink); font-weight:800; font-size:10px;
    padding:2px 7px; border-radius:8px;
  }
  .empty-hint{font-size:12px; color:var(--text-dim); text-align:center; padding:20px 10px;}
  .status-badge{font-size:9px; padding:2px 6px; border-radius:4px; background:var(--border-soft); color:var(--text-dim);}
  .status-badge.active{background:var(--green); color:#fff;}
  .status-badge.boost{background:var(--gold); color:var(--ink);}
</style>
</head>
<body>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="crest">🏰</span>
      <div>
        <h1>Kingdoms &amp; Words</h1>
        <div class="pi-user" id="piUserLabel"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat gold"><span class="icon">🪙</span><span id="goldVal">0</span><span id="crownBadge" class="crown-badge" style="display:none;"></span></div>
      <div class="stat gems"><span class="icon">💎</span><span id="gemsVal">0</span></div>
      <div class="stat">
        <span class="icon">⚡</span>
        <div class="energy-pips" id="energyPips"></div>
      </div>
      <div class="stat streak" id="streakStat" title="Daily streak">
        <span class="icon">🔥</span><span id="streakVal">0</span>
        <span class="icon" style="margin-left:4px" title="Streak freezes available">🧊</span><span id="freezeVal">0</span>
      </div>
    </div>
  </div>

  <div class="tabnav">
    <button data-tab="city" class="active"><span class="tico">🏙️</span>City</button>
    <button data-tab="puzzle"><span class="tico">📜</span>Words</button>
    <button data-tab="tribe"><span class="tico">🧑‍🤝‍🧑</span>Tribe</button>
    <button data-tab="shop"><span class="tico">🛒</span>Shop</button>
  </div>

  <div id="tab-city"></div>
  <div id="tab-puzzle" style="display:none;"></div>
  <div id="tab-tribe" style="display:none;"></div>
  <div id="tab-shop" style="display:none;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1900);
}

function fmtGold(n){ return n.toLocaleString(); }

function trustTitle(v){
  if(v>=100) return "Confidant";
  if(v>=75) return "Ally";
  if(v>=50) return "Friend";
  if(v>=25) return "Acquaintance";
  return "Stranger";
}
function trustTier(v){
  if(v>=100) return 4;
  if(v>=75) return 3;
  if(v>=50) return 2;
  if(v>=25) return 1;
  return 0;
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
function openModal(html){
  document.getElementById('modalBody').innerHTML = `<div class="modal-handle"></div>${html}`;
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function unlockDayForPlot(i){
  if(state.currentRegionId !== 'home') return null;
  if(i < 12) return null;
  return 15 + (i - 12) * 3;
}

function switchRegion(regionId){
  if(regionId === state.currentRegionId) return;
  if(!state.unlockedRegionIds.includes(regionId)) return;
  state.regions[state.currentRegionId] = { buildings: state.buildings };
  state.currentRegionId = regionId;
  state.buildings = (state.regions[regionId] && state.regions[regionId].buildings) || Array(16).fill(null);
  renderAll();
}

function unlockRegion(regionId){
  const def = REGIONS.find(r=>r.id===regionId);
  if(!def || state.unlockedRegionIds.includes(regionId)) return;
  if(state.gold < def.unlockCost) return toast('Not enough gold to found this region yet');
  state.gold -= def.unlockCost;
  state.unlockedRegionIds.push(regionId);
  state.regions[regionId] = { buildings: Array(16).fill(null) };
  toast(`${def.icon} ${def.name} founded!`);
  switchRegion(regionId);
}

function buildingCost(type, level){
  const base = BUILDING_TYPES[type].baseCost;
  return Math.round(base * level * 0.85) + (level-1)*6;
}

const CROWN_BONUS_PER_PRESTIGE = 5;
const CROWN_BONUS_CAP = 50;
function crownBonusPercent(){
  return Math.min(state.prestigeCount * CROWN_BONUS_PER_PRESTIGE, CROWN_BONUS_CAP);
}
function addGold(amount){
  const total = Math.round(amount * (1 + crownBonusPercent()/100));
  state.gold += total;
  return total;
}
function canPrestige(){
  return state.unlockedRegionIds.length >= REGIONS.length;
}
function doPrestige(){
  if(!canPrestige()) return;
  const fresh = freshState();
  fresh.streak = state.streak;
  fresh.lastPlayedDate = state.lastPlayedDate;
  fresh.streakFreezes = state.streakFreezes;
  fresh.wordHistory = state.wordHistory;
  fresh.wordMemory = state.wordMemory;
  fresh.skins = state.skins;
  fresh.equippedSkin = state.equippedSkin;
  fresh.prestigeCount = state.prestigeCount + 1;
  fresh.totalDonated = state.totalDonated;
  fresh.gems = state.gems;
  fresh.patronUntil = state.patronUntil;
  fresh.gemConversionLifetime = state.gemConversionLifetime || 0;
  // Preserve new features
  fresh.autoHarvest = state.autoHarvest || false;
  fresh.boosterUses = state.boosterUses || 0;
  state = fresh;
  toast(`👑 New dynasty founded! Permanent gold bonus: +${crownBonusPercent()}%`);
  renderAll();
}

function donateGold(amount){
  if(amount<=0) return;
  if(state.gold < amount) return toast('Not enough gold');
  state.gold -= amount;
  const before = state.totalDonated;
  state.totalDonated += amount;
  const newlyUnlocked = MEMORIALS.filter(m=> before < m.threshold && state.totalDonated >= m.threshold);
  if(newlyUnlocked.length){
    const m = newlyUnlocked[newlyUnlocked.length-1];
    toast(`${m.icon} ${m.name} unlocked! Donated 🪙${amount} to the Memorial Hall.`);
  } else {
    toast(`Donated 🪙${amount} to the Memorial Hall.`);
  }
  renderAll();
}

/* ============================= DAILY STREAK ============================= */

function daysSinceDateString(dateStr){
  if(!dateStr) return null;
  const past = new Date(new Date(dateStr).toDateString());
  const today = new Date(new Date().toDateString());
  return Math.round((today - past) / 86400000);
}

function applyDailyStreak(){
  const today = new Date().toDateString();
  if(state.lastPlayedDate === today) return;

  const gap = daysSinceDateString(state.lastPlayedDate);
  let usedFreeze = false;

  if(gap === 1){
    state.streak += 1;
  } else if(gap === 2 && state.streakFreezes > 0){
    state.streakFreezes -= 1;
    state.streak += 1;
    usedFreeze = true;
  } else {
    state.streak = 1;
  }
  state.lastPlayedDate = today;

  let bonus = 5;
  let msg = usedFreeze
    ? `🧊 Streak freeze used — your ${state.streak}-day streak is safe! +🪙${bonus}`
    : `📅 Day ${state.streak} streak! +🪙${bonus}`;
  if(state.streak % 5 === 0){
    bonus += 20;
    msg = usedFreeze
      ? `🧊 Freeze used, and you hit a ${state.streak}-day milestone! +🪙${bonus}`
      : `🔥 ${state.streak}-day streak milestone! +🪙${bonus}`;
  }
  addGold(bonus);
  toast(msg);
}

/* ============================= NEXT DAY ============================= */

function nextDay(){
  // Auto-Harvest: collect income automatically at day start
  let income = 0;
  if(state.autoHarvest){
    const allGrids = [state.buildings, ...Object.values(state.regions).map(r=>r.buildings)];
    allGrids.forEach(grid=>{
      grid.forEach(b=>{
        if(b && BUILDING_TYPES[b.type].group==='production') income += b.level*4;
      });
    });
    addGold(income);
  }

  state.day += 1;
  state.energy = state.maxEnergy;
  state.solvedCategoriesToday = new Set();
  state.legendaryUsedToday = false;
  state.safetyNetUsedToday = false;
  state.tribePleaUsedToday = false;
  
  // Reset tribe requests
  Object.keys(state.tribe).forEach(id=>{
    const cat = TRIBE_DATA.find(m=>m.id===id).category;
    state.tribe[id].fulfilledToday = false;
    // If there's a reserved request, use it, otherwise random
    if(state.tribe[id].reserved){
      state.tribe[id].request = state.tribe[id].reserved;
      state.tribe[id].reserved = null;
    } else {
      state.tribe[id].request = randomWordFrom(cat);
    }
  });
  
  refreshMerchantIfDue();
  
  if(isPatronActive()){
    state.gems = (state.gems||0) + 2;
    toast(income>0 ? `New day! Collected 🪙${income} from your buildings (auto-harvest) + 💎2 patron trickle.` : `A new day begins — energy fully restored. +💎2 patron trickle.`);
  } else {
    toast(income>0 ? `New day! Collected 🪙${income} from your buildings (auto-harvest).` : `A new day begins — energy fully restored.`);
  }
  renderAll();
}

function refreshMerchantIfDue(){
  if(state.merchant && state.day > state.merchant.availableUntilDay){
    state.merchant = null;
  }
  if(!state.merchant && state.day % 3 === 0){
    const candidates = [];
    Object.keys(BUILDING_TYPES).forEach(key=>{
      const owned = state.skins[key] || [0];
      [1,2].forEach(idx=>{ if(!owned.includes(idx)) candidates.push({buildingKey:key, skinIdx:idx}); });
    });
    if(candidates.length>0){
      const pick = candidates[Math.floor(Math.random()*candidates.length)];
      state.merchant = {
        buildingKey: pick.buildingKey,
        skinIdx: pick.skinIdx,
        price: 15,
        availableUntilDay: state.day + 3,
      };
      const def = BUILDING_TYPES[pick.buildingKey];
      toast(`🧳 A traveling merchant is visiting until Day ${state.merchant.availableUntilDay} — selling a ${SHOP_SKINS[pick.skinIdx]} ${def.name} skin.`);
    }
  }
}

function pickPuzzleWords(catKey, diffKey){
  const diff = DIFFICULTY[diffKey];
  const catWords = WORDS[catKey].list;
  if(!state.wordHistory[catKey]) state.wordHistory[catKey] = new Set();
  if(!state.wordMemory[catKey]) state.wordMemory[catKey] = {};
  const hist = state.wordHistory[catKey];
  const mem = state.wordMemory[catKey];
  const todayMs = new Date(new Date().toDateString()).getTime();

  const dueWords = catWords.filter(w=>{
    const m = mem[w.word];
    return m && m.due && new Date(m.due).getTime() <= todayMs;
  });
  let picked = shuffle(dueWords).slice(0, diff.words);
  picked.forEach(w=>hist.add(w.word));

  diff.tierPools.forEach(tier=>{
    if(picked.length >= diff.words) return;
    const pool = catWords.filter(w=>w.tier===tier && !picked.some(p=>p.word===w.word));
    let unseen = pool.filter(w=>!hist.has(w.word));
    if(unseen.length===0 && pool.length>0){
      pool.forEach(w=>hist.delete(w.word));
      unseen = pool.filter(w=>!picked.some(p=>p.word===w.word));
    }
    const need = diff.words - picked.length;
    picked = picked.concat(shuffle(unseen).slice(0, need));
  });
  if(picked.length < diff.words){
    const rest = catWords.filter(w=>!picked.some(p=>p.word===w.word));
    picked = picked.concat(shuffle(rest).slice(0, diff.words-picked.length));
  }
  picked.forEach(w=>hist.add(w.word));
  return shuffle(picked).slice(0, diff.words);
}

const REVIEW_INTERVALS_DAYS = [1, 3, 7, 16, 30];
function updateWordMemory(catKey, word, flawless){
  if(!state.wordMemory[catKey]) state.wordMemory[catKey] = {};
  const mem = state.wordMemory[catKey];
  const rec = mem[word] || { level:0, due:null };
  rec.level = flawless
    ? Math.min(rec.level+1, REVIEW_INTERVALS_DAYS.length-1)
    : 0;
  const days = REVIEW_INTERVALS_DAYS[rec.level];
  rec.due = new Date(Date.now() + days*86400000).toDateString();
  mem[word] = rec;
}

function pickDecoyLetters(word, count){
  if(count<=0) return [];
  const used = new Set(word.split(''));
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c=>!used.has(c));
  return shuffle(alphabet).slice(0, count);
}

function startPuzzle(catKey, diffKey){
  const diff = DIFFICULTY[diffKey];
  if(state.energy < diff.energyCost) return;
  if(diff.oncePerDay && state.legendaryUsedToday) return;
  state.energy -= diff.energyCost;
  if(diff.oncePerDay) state.legendaryUsedToday = true;

  const source = pickPuzzleWords(catKey, diffKey);
  const words = source.map((w,idx)=>{
    let letters = w.word.split('').map((ch,li)=>({id:`${idx}-c-${li}`, letter:ch, used:false, decoy:false}));
    const decoys = pickDecoyLetters(w.word, diff.decoysPerWord).map((ch,di)=>({id:`${idx}-d-${di}`, letter:ch, used:false, decoy:true}));
    const tiles = shuffle(letters.concat(decoys));
    return {
      word:w.word,
      clue:w.clue,
      tiles,
      blanks: w.word.split('').map(()=>null),
      solved:false,
      flawless:true,
      safetyNetPositions: [], // Track which positions were saved by safety net
    };
  });
  state.puzzle = {
    category:catKey,
    difficulty:diffKey,
    words,
    current:0,
    goldEarned:0,
    fullyFlawless:true,
    boosterActive: state.boosterUses > 0,
  };
  renderAll();
}

function isRequestWord(catKey, word){
  return TRIBE_DATA.filter(m=>m.category===catKey).some(m=> state.tribe[m.id].request===word && !state.tribe[m.id].fulfilledToday);
}

// --- NEW: Puzzle helper features ---

// 1. DECOY ERASER: Remove all decoy tiles from the current word's tile bank
function useDecoyEraser(wi){
  const w = state.puzzle.words[wi];
  const decoys = w.tiles.filter(t=>t.decoy && !t.used);
  if(decoys.length === 0) return toast('No decoy letters left!');
  decoys.forEach(t=>t.used = true);
  toast(`🧹 ${decoys.length} decoy letters removed!`);
  renderAll();
}

// 2. SHUFFLE: Randomize unused tiles in the current word's bank
function useShuffle(wi){
  const w = state.puzzle.words[wi];
  const unused = w.tiles.filter(t=>!t.used);
  if(unused.length <= 1) return toast('Not enough tiles to shuffle.');
  const shuffled = shuffle(unused);
  let idx = 0;
  w.tiles.forEach(t=>{
    if(!t.used){
      t.letter = shuffled[idx].letter;
      t.decoy = shuffled[idx].decoy;
      idx++;
    }
  });
  toast('🔀 Tiles shuffled!');
  renderAll();
}

// 3. TRIBE PLEA: Reveal first two letters of the current word (once per day)
function useTribePlea(wi){
  if(state.tribePleaUsedToday) return toast('Tribe plea already used today.');
  const w = state.puzzle.words[wi];
  if(w.solved) return toast('This word is already solved!');
  const emptyIdx = w.blanks.findIndex(b=>b===null);
  if(emptyIdx === -1) return toast('Word is already complete!');
  // Reveal first two empty positions
  let revealed = 0;
  for(let i=0; i<w.blanks.length && revealed<2; i++){
    if(w.blanks[i] === null){
      const correctLetter = w.word[i];
      const tile = w.tiles.find(t=> !t.used && t.letter===correctLetter && !t.decoy);
      if(tile){
        w.blanks[i] = tile.id;
        tile.used = true;
        revealed++;
      }
    }
  }
  if(revealed === 0) return toast('No letters to reveal!');
  state.tribePleaUsedToday = true;
  w.flawless = false;
  toast(`📣 Tribe plea revealed ${revealed} letter${revealed>1?'s':''}!`);
  // Check if word is now solved
  if(w.blanks.every(b=>b!==null)){
    const guess = w.blanks.map(id=> w.tiles.find(t=>t.id===id).letter).join('');
    if(guess === w.word) wordSolved(wi);
  }
  renderAll();
}

// 4. SAFETY NET: Mark the current word for safety net on next wrong guess
function useSafetyNet(wi){
  if(state.safetyNetUsedToday) return toast('Safety Net already used today.');
  const w = state.puzzle.words[wi];
  if(w.solved) return toast('This word is already solved!');
  // Store current correct positions
  w.safetyNetPositions = [];
  w.blanks.forEach((tileId, idx)=>{
    if(tileId !== null){
      const tile = w.tiles.find(t=>t.id===tileId);
      if(tile && tile.letter === w.word[idx]){
        w.safetyNetPositions.push(idx);
      }
    }
  });
  state.safetyNetUsedToday = true;
  toast('🛡️ Safety Net activated! Correct letters will be preserved on next wrong guess.');
  renderAll();
}

// 5. BOOSTER: Purchase and track booster uses
function buyBooster(){
  if(state.gold < 60) return toast('Not enough gold.');
  state.gold -= 60;
  state.boosterUses = (state.boosterUses || 0) + 3;
  toast('📈 Booster activated for 3 puzzles! Gold rewards doubled.');

}

function buyBoosterGems(){
  if((state.gems||0) < 150) return toast('Not enough gems.');
  state.gems -= 150;
  state.boosterUses = (state.boosterUses || 0) + 3;
  toast('💎📈 Booster activated for 3 puzzles! Gold rewards doubled.');
  renderAll();
}

// 6. SKIP PUZZLE: Exit early with earned gold, no mastery bonus, unsolved words not tracked
function skipPuzzle(){
  const p = state.puzzle;
  if(!p) return;
  // Add earned gold (without mastery bonus)
  const totalEarned = p.goldEarned;
  if(totalEarned > 0){
    const paidOut = addGold(totalEarned);
    toast(`⏩ Puzzle skipped! Kept 🪙${paidOut} earned. Mastery bonus forfeited.`);
  } else {
    toast('⏩ Puzzle skipped. No gold earned this round.');
  }
  // Mark solved words as learned, but only if they were solved flawlessly AND
  // the word was completed without hints/axes/safety net
  p.words.forEach(w=>{
    if(w.solved && w.flawless){
      updateWordMemory(p.category, w.word, true);
    } else if(w.solved && !w.flawless){
      updateWordMemory(p.category, w.word, false);
    }
    // Unsolved words are NOT added to memory - they'll reappear later
  });
  state.puzzle = null;
  renderAll();
}

// --- Modified placeTile to support Safety Net ---
function placeTile(wi, tileId){
  const w = state.puzzle.words[wi];
  const tile = w.tiles.find(t=>t.id===tileId);
  if(!tile || tile.used) return;
  const emptyIdx = w.blanks.findIndex(b=>b===null);
  if(emptyIdx===-1) return;
  w.blanks[emptyIdx] = tileId;
  tile.used = true;

  if(w.blanks.every(b=>b!==null)){
    const guess = w.blanks.map(id=> w.tiles.find(t=>t.id===id).letter).join('');
    if(guess === w.word){
      wordSolved(wi);
    } else {
      // WRONG GUESS - check for Safety Net
      const safePositions = w.safetyNetPositions || [];
      renderAll();
      const row = document.getElementById('row-'+wi);
      if(row) row.classList.add('shake');
      
      setTimeout(()=>{
        // If safety net is active, preserve correct letters
        if(safePositions.length > 0){
          // Reset all blanks, then restore safe positions
          const safeLetters = {};
          safePositions.forEach(idx=>{
            const tileIdAtIdx = w.blanks[idx];
            if(tileIdAtIdx){
              const t = w.tiles.find(t=>t.id===tileIdAtIdx);
              if(t && t.letter === w.word[idx]){
                safeLetters[idx] = t;
              }
            }
          });
          w.blanks = w.blanks.map((_, idx)=>{
            if(safeLetters[idx]){
              return safeLetters[idx].id;
            }
            return null;
          });
          w.tiles.forEach(t=>{
            // Only mark tiles as unused if they're not in a safe position
            let isSafe = false;
            Object.values(safeLetters).forEach(safeTile=>{
              if(safeTile.id === t.id) isSafe = true;
            });
            if(!isSafe) t.used = false;
          });
          toast('🛡️ Safety Net preserved your correct letters!');
        } else {
          // No safety net - full reset
          w.blanks = w.blanks.map(()=>null);
          w.tiles.forEach(t=>t.used=false);
        }
        w.flawless = false;
        w.safetyNetPositions = []; // Clear safety net after use
        renderAll();
      }, 550);
      return;
    }
  }
  renderAll();
}

// --- Modified wordSolved to handle Booster ---
function wordSolved(wi){
  const p = state.puzzle;
  const w = p.words[wi];
  w.solved = true;
  const diff = DIFFICULTY[p.difficulty];
  let base = diff.rewardPerWord;
  
  // Apply booster if active
  if(p.boosterActive && state.boosterUses > 0){
    base = Math.round(base * 2);
    state.boosterUses = Math.max(0, state.boosterUses - 1);
    if(state.boosterUses === 0) toast('📈 Booster expired!');
  }
  
  const bonus = w.flawless ? Math.round(base * 0.25) : 0;
  let gained = base + bonus;

  const reqWord = isRequestWord(p.category, w.word);
  if(reqWord){
    const member = TRIBE_DATA.find(m=> m.category===p.category && state.tribe[m.id].request===w.word && !state.tribe[m.id].fulfilledToday);
    if(member){
      state.tribe[member.id].fulfilledToday = true;
      state.tribe[member.id].trust = Math.min(100, state.tribe[member.id].trust + 10);
      gained += 10;
      toast(`${member.name} is thrilled with "${w.word}"! +10 trust`);
    }
  }
  if(!w.flawless) p.fullyFlawless = false;
  updateWordMemory(p.category, w.word, w.flawless);
  p.goldEarned += gained;
  state.solvedCategoriesToday.add(p.category);

  const nextIdx = p.words.findIndex((ww,i)=> i>p.current && !ww.solved);
  if(nextIdx!==-1){
    p.current = nextIdx;
  } else {
    const anyUnsolved = p.words.findIndex(ww=>!ww.solved);
    if(anyUnsolved!==-1) p.current = anyUnsolved;
  }
  renderAll();
}

function removeTile(wi,bi){
  const w = state.puzzle.words[wi];
  const tileId = w.blanks[bi];
  if(tileId===null) return;
  const tile = w.tiles.find(t=>t.id===tileId);
  tile.used = false;
  w.blanks[bi] = null;
  renderAll();
}

function useHint(wi){
  if(state.hints<=0) return;
  const w = state.puzzle.words[wi];
  const emptyIdx = w.blanks.findIndex(b=>b===null);
  if(emptyIdx===-1) return;
  const correctLetter = w.word[emptyIdx];
  const tile = w.tiles.find(t=> !t.used && t.letter===correctLetter && !t.decoy);
  if(!tile) return;
  state.hints -= 1;
  w.flawless = false;
  w.blanks[emptyIdx] = tile.id;
  tile.used = true;
  if(w.blanks.every(b=>b!==null)){
    const guess = w.blanks.map(id=> w.tiles.find(t=>t.id===id).letter).join('');
    if(guess === w.word) wordSolved(wi); else renderAll();
  } else {
    renderAll();
  }
}

function useAxe(wi){
  if(state.axes<=0) return;
  state.axes -= 1;
  useHintLikeAxe(wi);
}

function useHintLikeAxe(wi){
  const w = state.puzzle.words[wi];
  const emptyIdx = w.blanks.findIndex(b=>b===null);
  if(emptyIdx===-1) return;
  const correctLetter = w.word[emptyIdx];
  const tile = w.tiles.find(t=> !t.used && t.letter===correctLetter && !t.decoy);
  if(!tile) return;
  w.flawless = false;
  w.blanks[emptyIdx] = tile.id;
  tile.used = true;
  if(w.blanks.every(b=>b!==null)){
    const guess = w.blanks.map(id=> w.tiles.find(t=>t.id===id).letter).join('');
    if(guess === w.word) wordSolved(wi); else renderAll();
  } else {
    renderAll();
  }
}

function finishPuzzle(){
  const p = state.puzzle;
  const diff = DIFFICULTY[p.difficulty];
  let total = p.goldEarned;
  let masteryMsg = '';
  if(p.fullyFlawless){
    total += diff.masteryBonus;
    masteryMsg = ` + 🏅 Mastery Bonus ${diff.masteryBonus}`;
  }
  const paidOut = addGold(total);
  const crownNote = paidOut>total ? ` (👑 +${paidOut-total} crown bonus)` : '';
  toast(`Puzzle complete! +🪙${paidOut}${masteryMsg}${crownNote}`);
  state.puzzle = null;
  state.puzzlesSolved = (state.puzzlesSolved || 0) + 1;
  renderAll();
  setTimeout(openTreasureChest, 2100);
}

function openTreasureChest(){
  let goldReward = Math.floor(Math.random()*11) + 5;
  // Boost also applies to treasure chest!
  if(state.boosterUses > 0){
    goldReward = Math.round(goldReward * 2);
    state.boosterUses = Math.max(0, state.boosterUses - 1);
    if(state.boosterUses === 0) toast('📈 Booster expired!');
  }
  const paidOut = addGold(goldReward);
  let msg = `🎁 Treasure chest: +🪙${paidOut}`;

  const bonusRoll = Math.random();
  if(bonusRoll < 0.12 && state.energy < state.maxEnergy){
    state.energy += 1;
    msg += ' + ⚡1 energy!';
  } else if(bonusRoll < 0.30){
    state.hints += 1;
    msg += ' + 💡1 hint!';
  } else {
    msg += '!';
  }
  toast(msg);
  renderAll();
}

/* ============================= GEM CONVERSION ============================= */

function getWeekStart() {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? 6 : day - 1);
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0,10);
}

function convertGemsToGold(amount) {
  if (state.day < 10) return toast('يجب أن تصل إلى اليوم 10 لفتح تحويل الجواهر.');
  if ((state.puzzlesSolved || 0) < 20) return toast('يجب أن تحل 20 لغزًا على الأقل لفتح التحويل.');

  const today = new Date().toISOString().slice(0,10);
  const weekStart = getWeekStart();

  if (state.lastConversionDate !== today) {
    state.gemConversionToday = 0;
    state.lastConversionDate = today;
  }
  if (state.lastConversionWeekStart !== weekStart) {
    state.gemConversionWeek = 0;
    state.lastConversionWeekStart = weekStart;
  }

  const dailyLimit = 200;
  const weeklyLimit = 1000;
  const lifetimeLimit = 10000;

  if (state.gemConversionToday + amount > dailyLimit)
    return toast(`لا يمكن تحويل أكثر من ${dailyLimit} جوهرة في اليوم.`);
  if (state.gemConversionWeek + amount > weeklyLimit)
    return toast(`لا يمكن تحويل أكثر من ${weeklyLimit} جوهرة في الأسبوع.`);
  if (state.gemConversionLifetime + amount > lifetimeLimit)
    return toast(`لقد وصلت إلى الحد الأقصى للتحويل مدى الحياة (${lifetimeLimit} جوهرة).`);

  if ((state.gems || 0) < amount) return toast('ليس لديك ما يكفي من الجواهر.');
  state.gems -= amount;
  const goldEarned = amount * 2;
  addGold(goldEarned);

  state.gemConversionToday += amount;
  state.gemConversionWeek += amount;
  state.gemConversionLifetime += amount;

  toast(`تم تحويل 💎${amount} → 🪙${goldEarned}`);
  renderAll();
}

/* ============================= PI NETWORK INTEGRATION ============================= */

let piUser = null;
const piInBrowser = typeof Pi !== 'undefined';

function onIncompletePaymentFound(payment){
  console.log('Incomplete Pi payment found, attempting to resume:', payment);
  if(payment && payment.identifier){
    fetch(`${API_BASE}/payments/complete`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ paymentId: payment.identifier, txid: payment.transaction && payment.transaction.txid, playerId: getPlayerId() }),
    }).catch(e=>console.warn('Could not resume incomplete payment:', e));
  }
}

function authenticateWithPi(){
  return Pi.authenticate(['username','payments'], onIncompletePaymentFound)
    .then((auth)=>{
      piUser = auth.user;
      toast(`Welcome, ${piUser.username}! Your kingdom is linked to your Pi account.`);
    })
    .catch((err)=>{
      console.error('Pi authentication failed:', err);
    });
}

function initPi(){
  if(!piInBrowser){
    console.log('Pi SDK not detected — running as a regular web app.');
    return Promise.resolve();
  }
  Pi.init({ version: "2.0" });
  return authenticateWithPi();
}

/* ============================= PI PAYMENTS ============================= */

function purchaseWithPi(amount, memo, metadata){
  if(!piInBrowser){
    toast('Open this game inside the Pi Browser to make a purchase.');
    return;
  }
  if(!piUser){
    toast('Sign in with Pi first — trying again…');
    return;
  }
  if(!API_BASE){
    toast('This build has no payment server configured yet (API_BASE is empty).');
    return;
  }
  Pi.createPayment({ amount, memo, metadata }, {
    onReadyForServerApproval: (paymentId)=>{
      fetch(`${API_BASE}/payments/approve`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ paymentId, playerId: getPlayerId() }),
      }).catch(e=>console.error('Approve request failed:', e));
    },
    onReadyForServerCompletion: (paymentId, txid)=>{
      fetch(`${API_BASE}/payments/complete`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ paymentId, txid, playerId: getPlayerId() }),
      })
        .then(r=>r.json())
        .then(data=>{
          if(data && data.grantedState){
            state = deserializeState(data.grantedState);
            toast('✅ Purchase complete!');
            renderAll();
          } else {
            toast('Payment completed, but the server response looked unexpected — check your balance.');
          }
        })
        .catch(e=>{ console.error('Complete request failed:', e); toast('Payment made, but confirming it failed — contact support if your balance looks wrong.'); });
    },
    onCancel: ()=> toast('Payment cancelled.'),
    onError: (error)=>{ console.error('Pi payment error:', error); toast('Payment failed — please try again.'); },
  });
}

function buyGemPack(pack){
  purchaseWithPi(pack.piPrice, `${pack.gems} Gems (including ${pack.bonus} bonus) — Kingdoms & Words`, { kind:'gems', gems:pack.gems });
}

/* ============================= SAVE / LOAD ============================= */

const API_BASE = "";
const LOCAL_KEY_PREFIX = 'kingdomsWords_save_';

function getPlayerId(){
  if(piUser && piUser.username) return 'pi_' + piUser.username;
  let gid = localStorage.getItem('kw_guest_id');
  if(!gid){
    gid = 'guest_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    try{ localStorage.setItem('kw_guest_id', gid); }catch(e){}
  }
  return gid;
}

function serializeState(s){
  return {
    ...s,
    solvedCategoriesToday: Array.from(s.solvedCategoriesToday),
    wordHistory: Object.fromEntries(
      Object.entries(s.wordHistory).map(([k,v])=>[k, Array.from(v)])
    ),
  };
}
function deserializeState(obj){
  const merged = { ...freshState(), ...obj };
  merged.solvedCategoriesToday = new Set(obj.solvedCategoriesToday || []);
  merged.wordHistory = {};
  Object.entries(obj.wordHistory || {}).forEach(([k,v])=>{
    merged.wordHistory[k] = new Set(v);
  });
  return merged;
}

function saveLocal(s){
  try{
    localStorage.setItem(LOCAL_KEY_PREFIX + getPlayerId(), JSON.stringify(serializeState(s)));
  }catch(e){ console.warn('localStorage save failed:', e); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY_PREFIX + getPlayerId());
    return raw ? deserializeState(JSON.parse(raw)) : null;
  }catch(e){ console.warn('localStorage load failed:', e); return null; }
}

async function saveRemote(s){
  if(!API_BASE) return;
  try{
    await fetch(`${API_BASE}/state/${encodeURIComponent(getPlayerId())}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(serializeState(s)),
    });
  }catch(e){ console.warn('Remote save failed, local save still has your progress:', e); }
}
async function loadRemote(){
  if(!API_BASE) return null;
  try{
    const res = await fetch(`${API_BASE}/state/${encodeURIComponent(getPlayerId())}`);
    if(!res.ok) return null;
    return deserializeState(await res.json());
  }catch(e){ console.warn('Remote load failed, falling back to local save:', e); return null; }
}

let _saveDebounce = null;
function saveState(){
  saveLocal(state);
  clearTimeout(_saveDebounce);
  _saveDebounce = setTimeout(()=> saveRemote(state), 600);
}
