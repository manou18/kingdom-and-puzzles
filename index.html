<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kingdoms &amp; Words</title>
<meta name="description" content="Kingdoms & Words — a word-puzzle kingdom builder for Pi Browser.">
<!-- Pi Network SDK: bridges this app to the Pi Browser (window.Pi). Safe to load even
     when opened in a regular browser — every call below is guarded with a typeof check. -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<div class="landing" id="landingScreen">
  <div class="landing-top">
    <div class="landing-crest">🏰</div>
    <h1 class="landing-title">Kingdoms &amp; Words</h1>
    <p class="landing-tagline">Build your kingdom and boost your English</p>
  </div>
  <div class="landing-bottom">
    <button class="btn primary landing-login" id="loginBtn">Log In</button>
    <div class="landing-note" id="landingNote"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <div class="topbar-fixed">
    <div class="topbar">
      <div class="brand">
        <span class="crest">🏰</span>
        <div class="brand-text">
          <div class="pi-user" id="piUserLabel" style="display:none;"></div>
          <div class="kingdom-name" id="kingdomNameLabel" style="display:none;"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat-divider"></div>
        <div class="stat gold" title="Gold">
          <span class="icon">🪙</span><span id="goldVal" class="val val-gold">0</span><span id="crownBadge" class="crown-badge" style="display:none;"></span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat gems" title="Gems">
          <span class="icon">💎</span><span id="gemsVal" class="val val-gems">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat" title="Energy">
          <span class="icon">⚡</span>
          <div class="energy-pips" id="energyPips"></div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat streak" id="streakStat" title="Daily streak">
          <span class="icon">🔥</span><span id="streakVal" class="val val-streak">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat" title="Streak freezes available">
          <span class="icon freeze-icon">🧊</span><span id="freezeVal" class="val val-freeze">0</span>
        </div>
      </div>
    </div>
  </div>

  <div class="app">
    <div id="tab-city"></div>
    <div id="tab-puzzle" style="display:none;"></div>
    <div id="tab-tribe" style="display:none;"></div>
    <div id="tab-shop" style="display:none;"></div>
    <div id="tab-leaderboard" style="display:none;"></div>
    <div id="tab-about" style="display:none;"></div>
  </div>

  <div class="tabnav-fixed">
    <div class="tabnav">
      <button data-tab="city" class="active"><span class="tico">🏙️</span>City</button>
      <button data-tab="puzzle"><span class="tico">📜</span>Words</button>
      <button data-tab="tribe"><span class="tico"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M11.3 2.4c.3-.5 1.1-.5 1.4 0l1.1 2-1.8-.4-1.8.4 1.1-2z"/><circle cx="12" cy="8.3" r="2.8"/><path d="M12 11.6c-3.4 0-6.2 2.6-6.6 6l-.3 2.9c-.1.6.4 1.1 1 1.1h11.8c.6 0 1.1-.5 1-1.1l-.3-2.9c-.4-3.4-3.2-6-6.6-6z"/></svg></span>Tribe</button>
      <button data-tab="shop"><span class="tico">🛒</span>Shop</button>
      <button data-tab="leaderboard"><span class="tico">🏆</span>Ranks</button>
      <button data-tab="about"><span class="tico">ℹ️</span>About</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<script src="script.js"></script>
</body>
</html>
